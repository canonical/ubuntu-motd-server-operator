name: motd-server-app
base: ubuntu@26.04
version: "0.16"
summary: Ubuntu MOTD server
description: |
  This app serves the Message Of The Day (MOTD) for the Ubuntu servers.
platforms:
  amd64:

extensions:
  - flask-framework

parts:
  flask-framework.install-app:
    prime:
      - app/app.py
      - app/motd_server
